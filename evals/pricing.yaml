# USD per 1M tokens, used to cost calls when the provider does not report a
# cost itself (OpenRouter does, and that figure takes precedence). Matched by
# longest prefix, so dated snapshots like "gpt-4o-mini-2024-07-18" resolve.
# Source: provider price pages at the time of writing; verify before relying on it.
models:
  gpt-4o-mini: {input: 0.15, output: 0.60}
  gpt-4o: {input: 2.50, output: 10.00}
  gpt-4.1-nano: {input: 0.10, output: 0.40}
  gpt-4.1-mini: {input: 0.40, output: 1.60}
  gpt-4.1: {input: 2.00, output: 8.00}
  gpt-5-nano: {input: 0.05, output: 0.40}
  gpt-5-mini: {input: 0.25, output: 2.00}
  text-embedding-3-small: {input: 0.02, output: 0}
  text-embedding-3-large: {input: 0.13, output: 0}

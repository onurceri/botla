# Docker Compose for real service integration tests.
# Uses its own project name and host ports (Postgres 5433, Redis 6380, Qdrant
# 6334) so it can run next to the dev stack. Run the suites with
# `make test-integration-real` and tear down with `make test-integration-down`.
name: botla-integration

services:
  postgres-integration:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: botla_integration
      POSTGRES_USER: botla
      POSTGRES_PASSWORD: botla
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botla -d botla_integration"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_integration_data:/var/lib/postgresql/data

  redis-integration:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_integration_data:/data

  qdrant-integration:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    healthcheck:
      # The qdrant image ships neither wget nor curl, so probe /readyz with bash's
      # /dev/tcp and require an HTTP 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - qdrant_integration_data:/qdrant/storage

volumes:
  postgres_integration_data:
  redis_integration_data:
  qdrant_integration_data:

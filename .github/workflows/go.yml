name: Go

# Build, vet, lint and unit-test the backend on every push to main and every
# pull request that touches Go code. Real-service integration tests run in
# integration-tests.yml; the paid RAG eval suite runs in rag-evals.yml.
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'db/migrations/**'
      - '.golangci.yml'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'db/migrations/**'
      - '.golangci.yml'
      - '.github/workflows/go.yml'

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
          # Config verification downloads a JSON schema on every run, and a
          # failed download fails the job. The linters themselves still run.
          verify: false

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Several unit-test packages (repository, services, handlers, testdb) use a
    # real PostgreSQL through internal/testdb, which creates and migrates its own
    # schemas. Redis and Qdrant back the few tests that dial them directly.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botla
          POSTGRES_PASSWORD: botla
          POSTGRES_DB: botla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botla -d botla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: botla
      DB_PASSWORD: botla
      DB_NAME: botla_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -short skips the slow integration scenarios and the tests that launch a
      # real browser (those run in browser-tests.yml); the real-service suites
      # also stay off because TEST_INTEGRATION is not set.
      - name: Test
        run: go test -short -timeout 10m ./...
